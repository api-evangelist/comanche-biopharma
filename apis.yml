aid: comanche-biopharma
name: Comanche Biopharma
description: 'Comanche Biopharma is a clinical-stage biopharmaceutical company based
  in Concord, Massachusetts, developing investigational siRNA (small interfering RNA)
  medicines for maternal health. Its lead candidate, CBP-4888, is a subcutaneously
  administered siRNA therapy targeting sFlt1-mediated preterm preeclampsia, a leading
  and potentially life-threatening complication of pregnancy. The company''s mission
  is to develop and make globally available the first therapy targeting a root cause
  of preeclampsia. In April 2025, CBP-4888 received Orphan Drug Designation from the
  European Medicines Agency. Comanche Biopharma is a portfolio company of GV (Google
  Ventures). As a therapeutics company it publishes a corporate and scientific web
  presence rather than a public developer API surface.'
